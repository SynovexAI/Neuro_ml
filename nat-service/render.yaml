# Render Blueprint for the NAT sidecar. Deploy as a PRIVATE service (pserv) so it
# is reachable only from your Next.js app over Render's internal network — never
# publicly exposed. The Next app then calls http://nat-service:8000 internally.
#
# Set NAT_SERVICE_URL + NAT_SHARED_SECRET on the Next.js service to match.
services:
  - type: pserv
    name: nat-service
    runtime: docker
    dockerfilePath: ./nat-service/Dockerfile
    dockerContext: ./nat-service
    plan: starter
    envVars:
      - key: NAT_SHARED_SECRET
        sync: false
      - key: PORT
        value: 8000
